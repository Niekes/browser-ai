name: CI

on:
  - pull_request
  - push

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  template:
    name: Registry Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fallow resolves the template rules against the changed
          # files, so the history has to be there.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The health score reads the coverage of the registry.
      - run: pnpm coverage
      - name: Check the registry template
        run: pnpm lint
        env:
          # Report the findings as inline annotations on the pull
          # request instead of a wall of text in the log.
          FALLOW_FORMAT: github-annotations

  test:
    name: Test (Node ${{matrix.node}})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node}}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # With coverage: below 98 % in any metric the job fails.
      - run: pnpm coverage

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The demo page in Chrome, a WAV file for the microphone, no model.
      - run: pnpm test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test, template, e2e]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, the registry JSON and the prerendered docs.
      - run: pnpm build

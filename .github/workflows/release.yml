name: Release

# The registry is installed from the repository: a release is a tag that
# `npx shadcn add niekes/browser-ai/<item>#v<version>` can pin. The shadcn CLI
# does not pass the tag on to the registry dependencies, so the tag sits on a
# release commit beside `main` that pins them to it too.
on:
  push:
    branches: [main]
    paths:
      - package.json
  # Retries a release that failed.
  workflow_dispatch:

# One release at a time: a second merge waits for the first to tag its version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release on GitHub
    # A release is cut from `main` alone, a manual retry too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Read the release notes
        # A version without its section in CHANGELOG.md stops here; 0.0.0 is
        # no release yet.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = 0.0.0 ]; then
              echo "0.0.0 is not released."
              echo "RELEASED=false" >> "$GITHUB_ENV"
              exit 0
          fi
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
              echo "CHANGELOG.md has no section '## [$VERSION]' to release with."
              exit 1
          fi
      - name: Tag and release
        if: env.RELEASED != 'false'
        # A version that is released already is skipped, so dependency updates
        # that touch package.json without a version bump release nothing.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "v$VERSION is released on GitHub already."
              echo "RELEASED=false" >> "$GITHUB_ENV"
              exit 0
          fi
          # A rerun after the tag went out releases that tag instead of making another.
          if ! git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then
              # Pin every dependency on this registry to the release, and check the pin.
              sed -i "s|\"niekes/browser-ai/\([a-z0-9-]*\)\"|\"niekes/browser-ai/\1#v$VERSION\"|g" registry.json
              # The docs of the release install the release: every unpinned command is pinned.
              find docs/content docs/routes -name '*.mdx' -o -name '*.tsx' | xargs sed -i -E \
                "s~(add niekes/browser-ai/[a-z0-9-]+)(\$|[^a-z0-9#-])~\1#v$VERSION\2~g"
              pnpm lint:template
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              # The release commit stays off `main`: only its tag is pushed.
              git checkout --detach
              git commit -am "🔖 chore(release): $VERSION"
              git tag "v$VERSION"
              git push origin "v$VERSION"
          fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          echo "RELEASED=true" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy the docs of the release
        if: env.RELEASED == 'true'
        run: gh workflow run docs.yml --ref "v$(node -p "require('./package.json').version")"
        env:
          GH_TOKEN: ${{ github.token }}
